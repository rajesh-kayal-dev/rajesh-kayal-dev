<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rajesh Kayal — Software Engineer, Backend, Distributed Systems">
  <style>
    /* Default = dark GitHub */
    svg {
      --fg: #E6EDF3;
      --muted: #8B949E;
      --accent: #388BFD;
      --line: #30363D;
      --dot: #8B949E;
    }
    /* Light GitHub */
    @media (prefers-color-scheme: light) {
      svg {
        --fg: #1F2328;
        --muted: #59636E;
        --accent: #0969DA;
        --line: #D1D9E0;
        --dot: #59636E;
      }
    }

    .dot     { fill: var(--dot); }
    .eyebrow { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; fill: var(--accent); letter-spacing: 0.5px; }
    .name    { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 56px; font-weight: 700; fill: var(--fg); letter-spacing: -1.2px; }
    .role    { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 400; fill: var(--muted); letter-spacing: 0.2px; }
    .sep     { fill: var(--accent); }
    .tech    { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; fill: var(--muted); }
    .tdot    { fill: var(--accent); opacity: 0.7; }
    .status-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: var(--muted); }
    .status-dot, .status-ring { fill: var(--accent); }
    .base-line { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
    .scan-line { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
    .underline { stroke-width: 2; }

    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes draw   { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    @keyframes ring   { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes dotp   { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes scan   { 0% { transform: translateX(-160px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
    @keyframes drift  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes breathe { 0%, 100% { opacity: 0.16; } 50% { opacity: 0.26; } }

    /* very soft, slow, brief light-up on one tech item at a time */
    @keyframes glow {
      0%, 84%, 100% { opacity: 0.8; fill: var(--muted); }
      92%           { opacity: 1;   fill: var(--accent); }
    }

    .a-rise { opacity: 0; animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }
    .a-fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .underline { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s ease-out 0.6s forwards; }
    .status-dot  { animation: dotp 2s ease-in-out infinite; }
    .status-ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
    .scan-line   { animation: scan 6s linear 1.5s infinite; }
    .grid        { animation: drift 10s ease-in-out infinite; }
    .grid-wrap   { animation: breathe 9s ease-in-out infinite; }
    .tech        { animation: glow 12s ease-in-out infinite; }

    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.9s; }
    .c1 { animation-delay: 1.10s; } .c2 { animation-delay: 1.18s; } .c3 { animation-delay: 1.26s; }
    .c4 { animation-delay: 1.34s; } .c5 { animation-delay: 1.42s; } .c6 { animation-delay: 1.50s; }
    .c7 { animation-delay: 1.58s; } .c8 { animation-delay: 1.66s; } .c9 { animation-delay: 1.74s; }

    /* staggered, uneven delays so only one item glows at a time */
    .g1 { animation-delay: 3s; }  .g2 { animation-delay: 4.3s; } .g3 { animation-delay: 5.6s; }
    .g4 { animation-delay: 6.9s; } .g5 { animation-delay: 8.2s; } .g6 { animation-delay: 9.5s; }
    .g7 { animation-delay: 10.8s; } .g8 { animation-delay: 12.1s; } .g9 { animation-delay: 13.4s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
      .scan-line, .status-ring { opacity: 0 !important; }
    }
  </style>

  <defs>
    <radialGradient id="fadeGrad" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="300" fill="url(#fadeGrad)" />
    </mask>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" class="dot" />
    </pattern>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#388BFD" stop-opacity="1" />
      <stop offset="1" stop-color="#388BFD" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- fully transparent canvas: faint dot grid only, no panel or border -->
  <g mask="url(#gridMask)">
    <g class="grid-wrap">
      <rect class="grid" width="1200" height="300" fill="url(#dotGrid)" />
    </g>
  </g>

  <!-- status (no box) -->
  <g transform="translate(1030, 36)" class="a-fade d4">
    <circle class="status-ring" cx="4" cy="14" r="3" />
    <circle class="status-dot" cx="4" cy="14" r="3" />
    <text x="16" y="18" class="status-text">status: building</text>
  </g>

  <!-- eyebrow -->
  <g class="a-fade d1">
    <text x="100" y="82" class="eyebrow">~ whoami<tspan class="cursor">_</tspan></text>
  </g>

  <!-- name -->
  <g class="a-rise d2">
    <text x="98" y="140" class="name">Rajesh Kayal</text>
  </g>

  <!-- underline -->
  <line x1="100" y1="160" x2="500" y2="160" stroke="url(#accentGrad)" class="underline" />

  <!-- role -->
  <g class="a-rise d3">
    <text x="100" y="194" class="role">Software Engineer <tspan class="sep">·</tspan> Backend <tspan class="sep">·</tspan> Distributed Systems</text>
  </g>

  <!-- tech stack: plain text separated by dots, each softly lights up in turn -->
  <g>
    <g class="a-rise c1"><text class="tech g1" x="100"   y="236">typescript</text></g>
    <circle class="tdot a-fade c1" cx="196"   cy="231" r="2"/>
    <g class="a-rise c2"><text class="tech g2" x="208"   y="236">node.js</text></g>
    <circle class="tdot a-fade c2" cx="278.8" cy="231" r="2"/>
    <g class="a-rise c3"><text class="tech g3" x="290.8" y="236">postgresql</text></g>
    <circle class="tdot a-fade c3" cx="386.8" cy="231" r="2"/>
    <g class="a-rise c4"><text class="tech g4" x="398.8" y="236">mongodb</text></g>
    <circle class="tdot a-fade c4" cx="469.6" cy="231" r="2"/>
    <g class="a-rise c5"><text class="tech g5" x="481.6" y="236">redis</text></g>
    <circle class="tdot a-fade c5" cx="535.6" cy="231" r="2"/>
    <g class="a-rise c6"><text class="tech g6" x="547.6" y="236">kafka</text></g>
    <circle class="tdot a-fade c6" cx="601.6" cy="231" r="2"/>
    <g class="a-rise c7"><text class="tech g7" x="613.6" y="236">microservices</text></g>
    <circle class="tdot a-fade c7" cx="734.8" cy="231" r="2"/>
    <g class="a-rise c8"><text class="tech g8" x="746.8" y="236">system design</text></g>
    <circle class="tdot a-fade c8" cx="868"   cy="231" r="2"/>
    <g class="a-rise c9"><text class="tech g9" x="880"   y="236">docker</text></g>
  </g>

  <!-- baseline + scanning highlight -->
  <line x1="100" y1="272" x2="1100" y2="272" class="base-line" />
  <line x1="0" y1="272" x2="140" y2="272" class="scan-line" />
</svg>
